version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    misspell:
      locale: UK
      ignore-rules:
        - color
        - initialize
        - initialization
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - palm-gw
