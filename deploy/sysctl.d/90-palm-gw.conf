# palm-gw: route between the Palm subnet and the uplink.
net.ipv4.ip_forward = 1
# Loose, not strict: PPP peers live inside the same /24 as the bridge and are reached via /32 routes that
# pppd installs; strict rp_filter is correct here but loose removes any dependence on route timing.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# Leading "-": ignore the error when the bridge does not exist yet at sysctl time.
-net.ipv4.conf.{{BRIDGE}}.proxy_arp = 0
